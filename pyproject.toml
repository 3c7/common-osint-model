[project]
name = "common-osint-model"
version = "0.6.4-beta2"
description = "Converting data from services like BinaryEdge, Censys and Shodan to a common data model."
authors = [{ name = "3c7", email = "3c7@posteo.de" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mmh3==5.2.1",
  "cryptography==48.0.0",
  "pydantic==2.13.4",
  "hhhash==0.4",
  "urllib3==2.7.0",
  "censys-platform==0.14.0",
]

[project.urls]
Homepage = "https://github.com/3c7/common-osint-model"
Repository = "https://github.com/3c7/common-osint-model"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff==0.15.16", "ty==0.0.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
